name: ExcelJS UUID source reachability screen

on:
  push:
    branches: [feature/security-vitest-lockfile-candidate]
  pull_request:
    branches: [feature/excel-managed-v1]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean candidate install
        run: npm ci
      - name: Inspect UUID import and API use in installed ExcelJS library
        run: node verification/security/uuid-reachability.mjs
      - name: Preserve bounded static inspection
        uses: actions/upload-artifact@v4
        with:
          name: exceljs-uuid-static-reachability
          path: work/security-candidate/uuid-reachability.json
          retention-days: 14
