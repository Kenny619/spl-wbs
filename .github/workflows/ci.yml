name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=work/ci/unit.json
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-diagnostics
          path: work/ci/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser regression (Windows Chromium)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser tests
        run: npm run test:e2e -- --reporter=list,html
      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
