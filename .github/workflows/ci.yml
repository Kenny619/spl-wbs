name: CI

on:
  pull_request:
    # Retain accepted integration QA triggers until full migration is reviewed.
    branches: [main, feature/excel-managed-des010-ui, feature/des010-uat-edge-picker-fallback, feature/des010-uat02-visual-fixes]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:
    inputs:
      full_regression:
        description: Force full regression (unknown diffs also fail closed to full)
        required: false
        type: boolean
        default: true
      publish_owner_uat:
        description: Explicitly produce a synthetic-only, SHA-pinned Option A UAT ZIP
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: CI scope and tier selection
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      fast: ${{ steps.scope.outputs.fast }}
      browser: ${{ steps.scope.outputs.browser }}
      browser_scope: ${{ steps.scope.outputs.browser_scope }}
      packaging: ${{ steps.scope.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify composite CI tier policy
        run: node --test scripts/ci-plan.test.mjs
      - name: Select CI scope from changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs

  build-unit:
    name: Build + unit tests
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.fast == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Security advisory gate (high/critical production)
        run: npm audit --omit=dev --audit-level=high
      - name: UUID scanner positive and negative fixtures
        run: node verification/security/test-uuid-reachability.mjs
      - name: Bounded ExcelJS UUID reachability screening
        run: node verification/security/uuid-reachability.mjs
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=work/ci/unit.json
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Managed variant development build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:managed
      - name: Package Option A controlled owner UAT kit (explicit dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_owner_uat == true && success() && needs.plan.result == 'success' && needs.plan.outputs.browser_scope == 'full' }}
        run: node scripts/package-option-a-integrated-candidate.mjs
      - name: Controlled comprehensive Option A owner UAT artifact (NOT accepted/released)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_owner_uat == true && success() && needs.plan.result == 'success' && needs.plan.outputs.browser_scope == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: SPT-WBS-OptionA-Comprehensive-UAT-${{ github.sha }}
          path: work/option-a-candidate/
          if-no-files-found: error
          retention-days: 14
      # Explicit owner request 2026-11-16: one synthetic Stage B B2/B3 UAT
      # candidate for PR #92 only. Reuse this build runner (no extra Windows
      # or Ubuntu job). Artifact is NOT accepted until the parallel browser
      # job also finishes successfully and independent QA clears the scope.
      - name: Package Stage B #92 controlled fictional UAT candidate
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 92 && success() }}
        run: |
          node scripts/package-option-a-integrated-candidate.mjs
          node scripts/package-stage-b-uat.mjs
      - name: Publish Stage B #92 candidate artifact (NOT accepted/released)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 92 && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: SPT-WBS-StageB-NeedsAttention-Severity-UAT-${{ github.sha }}
          path: work/option-a-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Unit diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-diagnostics
          path: work/ci/
          if-no-files-found: ignore
          retention-days: 3

  browser:
    name: Browser regression (Windows Chromium)
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.browser == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI_BROWSER_SCOPE: ${{ needs.plan.outputs.browser_scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Full or component-targeted browser tests
        run: node scripts/run-browser-tier.mjs
      - name: Review product build (full gates only)
        id: reviewbuild
        if: ${{ needs.plan.outputs.packaging == 'true' && !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Prepare implementation validation package (full gates only)
        if: ${{ needs.plan.outputs.packaging == 'true' && !cancelled() && steps.reviewbuild.outcome == 'success' }}
        run: node scripts/package-baseline-review.mjs
      - name: Implementation validation package (full gates only)
        if: ${{ needs.plan.outputs.packaging == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: v18-implementation-validation-package
          path: work/v18-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser diagnostics (failure or full gate)
        if: ${{ failure() || needs.plan.outputs.packaging == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
