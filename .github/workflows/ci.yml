name: CI

on:
  pull_request:
    branches: [main, feature/excel-managed-des010-ui, feature/des010-uat-edge-picker-fallback, feature/des010-uat02-visual-fixes]
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: UUID scanner positive and negative fixtures
        run: node verification/security/test-uuid-reachability.mjs
      - name: Bounded ExcelJS UUID reachability screening
        run: node verification/security/uuid-reachability.mjs
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=work/ci/unit.json
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Managed variant development build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:managed
      - name: Prepare bounded Reports-only functional review kit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.ref == 'refs/heads/feature/reports-only-review-package-20261114' || github.head_ref == 'feature/reports-only-review-package-20261114') }}
        run: node scripts/package-reports-only-review.mjs
      - name: Reports-only functional review kit
        if: ${{ !cancelled() && (github.ref == 'refs/heads/feature/reports-only-review-package-20261114' || github.head_ref == 'feature/reports-only-review-package-20261114') }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-only-des012-functional-review
          path: work/reports-only-review/
          if-no-files-found: error
          retention-days: 7
      - name: Unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-diagnostics
          path: work/ci/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser regression (Windows Chromium)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser tests
        run: npm run test:e2e -- --reporter=list,html
      - name: Review product build
        id: reviewbuild
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Prepare implementation validation package
        if: ${{ !cancelled() && steps.reviewbuild.outcome == 'success' }}
        run: node scripts/package-baseline-review.mjs
      - name: Implementation validation package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-implementation-validation-package
          path: work/v18-review/
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
