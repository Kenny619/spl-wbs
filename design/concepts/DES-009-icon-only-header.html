/* DES-009: consolidated meeting focus and report-linked presentation */
.deadline-hero{display:flex;align-items:center;justify-content:space-between;gap:22px;background:#f1f7fb;border:1px solid #dbe8f1;border-radius:10px;padding:19px 22px;margin:16px 0 6px}
.deadline-hero strong{display:block;font-size:27px;letter-spacing:-.035em;line-height:1.2;margin-top:4px}
.deadline-count{text-align:right;border-left:1px solid #d1e3ee;padding-left:22px}
.deadline-count strong{font-size:35px;color:#176589}.deadline-count span{font-size:11px;color:#506f86;display:block;max-width:120px}
.calendar-caption{font-size:11px;color:#74879a;line-height:1.5;margin:7px 0 14px}
.b-layout .panelbody{max-width:1050px}.b-layout .focusfacts{grid-template-columns:repeat(4,minmax(0,1fr))}
.b-layout .focusfact b{font-size:16px;overflow-wrap:anywhere}.b-layout .focus-title{font-size:27px}
.b-layout .panel .savebar{margin-top:16px;padding:12px 0;border:0;background:none}
.reportbar{display:flex;gap:13px;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.reportbar strong{font-size:14px}.report-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.report-actions .choiceactive{background:#e1f1fa;border-color:#9bbfd7;color:#175f89}
.preview-shell{padding:25px 30px}.preview-shell h3{margin:0 0 12px;font-size:16px}
.preview-shell pre{font:13px/1.6 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fc;border:1px solid #e1e7ef;border-radius:10px;padding:18px;max-height:590px;overflow:auto}
@media(max-width:1100px){.reportbar{display:block}.report-actions{justify-content:flex-start;margin-top:10px}.b-layout .focusfacts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.deadline-hero{padding:12px}.deadline-hero strong{font-size:20px}.deadline-count{padding-left:12px}.deadline-count strong{font-size:28px}.report-actions button{font-size:11px}}

/* DES-009: task-list-first weekly review, compact detail, filter toolbar */
.b-layout{grid-template-columns:minmax(570px,1.44fr) minmax(370px,.92fr);align-items:start;gap:13px}
.meeting-list .panelhead{padding:12px 15px;min-height:53px}

.filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filter-pill{border:1px solid #d7e0e9;background:white;color:#36516b;border-radius:7px;font-size:12px;font-weight:650;padding:7px 9px}
.filter-pill.active{background:#e5f4fd;border-color:#92c8e6;color:#075c87}
.filter-selects{display:grid;grid-template-columns:1fr 1fr minmax(128px,.9fr);gap:9px;align-items:end}
.filter-selects label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#677c92;font-weight:650;min-width:0}
.filter-selects select,.filter-selects input{height:34px;padding:6px 8px;background:white;border:1px solid #dae3eb;border-radius:7px;min-width:0;width:100%;font-size:12px;color:#314a62}
.filter-caption{font-size:10px;color:#8392a2;margin-top:7px}

.meeting-columns{background:#f2f5f9;color:#718296;font-size:10px;font-weight:750;letter-spacing:.025em;padding:9px 14px;border-bottom:1px solid var(--line)}
.meeting-data{max-height:65vh;min-height:190px;overflow:auto}
.meeting-item{width:100%;text-align:left;border:0;border-bottom:1px solid #e9eef2;background:white;padding:10px 14px;min-height:55px;color:#24374c;cursor:pointer}
.meeting-item:hover{background:#f6fafe}.meeting-item.selected{background:#e5f4fb;box-shadow:inset 3px 0 #1880b0}
.meeting-item .entrytitle{font-size:12px;font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meeting-item .entrymeta{font-size:11px;color:#738498;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meeting-item .cell{font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meeting-item .cell:last-child{font-weight:690;color:#276486;white-space:normal}
.meeting-group{font-size:11px;font-weight:760;padding:9px 14px;color:#42617a;background:#edf3f8;border-bottom:1px solid #dce7ef}
.zero-match{padding:32px 18px;color:#687d90;font-size:13px;text-align:center}
.detail-compact .panelhead{padding:11px 15px;min-height:54px}
.detail-compact .panelbody{padding:14px 15px 17px}
.detail-compact .focus-title{font-size:19px;line-height:1.22;margin:5px 0 12px}
.detail-facts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.detail-fact{border:1px solid #e6ecf2;border-radius:7px;padding:9px 10px;min-width:0}
.detail-fact .key{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#75869b;font-weight:700;margin-bottom:3px}
.detail-fact .val{font-size:14px;font-weight:680;overflow-wrap:anywhere}
.detail-fact.due{background:#eef7fb;border-color:#d9eaf3}
.detail-fact.due .val{font-size:19px;color:#1c6689}
.detail-sub{font-size:10px;color:#778a9b;margin:8px 0 5px}
.detail-compact .sectionlabel{margin:13px 0 7px;font-size:10px}
.detail-compact .riskbox{margin:7px 0;padding:9px 10px}
.detail-compact .big-update{margin:7px 0;padding:10px 11px;font-size:12px}
.dependencies{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.dep-link{display:block;width:100%;background:#fff;border:1px solid #dce7f0;border-radius:6px;text-align:left;padding:8px;margin:5px 0;color:#176c94;font-size:11px;line-height:1.4;cursor:pointer}
.dep-link:hover{border-color:#99c6df;background:#eaf7fd}
.dep-link span{display:block;color:#7b8c99;font-size:10px;margin-top:3px}

.calendar-legend{font-size:11px;color:#526b80;border:1px solid #dfe7f0;background:#f6f9fc;border-radius:8px;padding:10px 12px;margin:10px 0 2px}

.detail-compact .savebar{margin-top:10px;padding:10px 0 0;border:0;background:transparent}
.report-period{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.report-period label{font-size:10px;color:#5f7285;display:flex;flex-direction:column;gap:3px}
.report-period input{height:33px;border:1px solid #dbe4ea;border-radius:7px;padding:6px;font-size:12px;color:#304b62;background:white}
.report-tags{font-size:11px;color:#6b7f90;margin-top:6px}
.report-proposed{background:#f0f8fc;border:1px solid #cce2f0;border-radius:8px;padding:10px 12px;font-size:11px;color:#426780;margin:12px 0}
.update-summary{grid-template-columns:repeat(4,minmax(0,1fr))}.storyrow{padding:10px 0;border-bottom:1px solid #edf0f4}
.storyrow:last-child{border-bottom:0}

/* DES-009: one compact header, a scrollable task list, anchored detail */
.top{height:60px;min-height:60px;padding:0 16px;gap:13px;flex-wrap:nowrap}
.brand{min-width:178px;gap:8px}.brandmeta{font-size:10px}.brandtitle{font-size:13px}
.project-head{display:flex;flex-direction:column;gap:1px;min-width:170px;max-width:235px;flex:1;line-height:1.2}
.project-head strong{font-size:14px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-head span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .concept-controls{flex-shrink:0}.top .concept-controls button{padding:8px 10px}
.top .phase-controls{flex-shrink:0}.top .phase-controls button{padding:7px 9px}
.topright{min-width:120px;font-size:10px}.topright b{font-size:10px}
body.view-meeting{height:100dvh;overflow:hidden}
body.view-meeting .canvas{height:calc(100dvh - 60px);max-width:none;display:flex;flex-direction:column;overflow:hidden;padding:12px 16px 14px}
body.view-meeting #app{flex:1;min-height:0;overflow:hidden}
body.view-meeting #app>.b-layout{height:100%;min-height:0;align-items:stretch}
body.view-meeting .meeting-list{display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden}
body.view-meeting .meeting-data{flex:1;min-height:0;max-height:none;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
body.view-meeting .detail-compact{min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.detail-identity{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.detail-id{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid #dbe6ee;border-radius:6px;background:#f4f8fa;font-size:11px;color:#345875}
.detail-id b{font-weight:750;color:#224b6a}
.detail-compact .panelhead{padding:10px 14px}
.detail-compact .panelbody{padding:11px 14px 15px}
.detail-compact .focus-title{margin:2px 0 11px}
.meeting-list .panelhead{min-height:48px}
.meeting-data:focus-visible{outline:3px solid #6bb1d6;outline-offset:-3px}
@media(max-width:1260px){
.topright{display:none}.top{gap:9px}.brand{min-width:160px}.project-head{max-width:220px;min-width:140px}
}
@media(max-width:970px){
body.view-meeting{height:auto;overflow:auto}
body.view-meeting .canvas{height:auto;display:block;overflow:visible}
body.view-meeting #app{overflow:visible}
body.view-meeting #app>.b-layout{height:auto;align-items:start}
body.view-meeting .meeting-list{max-height:none}
body.view-meeting .meeting-data{max-height:420px;flex:none}
body.view-meeting .detail-compact{max-height:none;overflow:visible}
.top{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 12px}
.project-head{min-width:150px;max-width:none}
}


/* DES-009: identical full-height workspaces with scrolling limited to panels.
   The header grid reserves positions for every navigation/control slot. */
.top{display:grid;grid-template-columns:42px minmax(145px,1fr) max-content 182px 118px;column-gap:10px;align-items:center;justify-content:initial;height:60px;min-height:60px;padding:0 16px}
.top .brand{min-width:0}
.top .project-head{min-width:0;max-width:none}
.top .concept-controls{justify-self:start;white-space:nowrap}
.top #phases{justify-self:stretch;width:182px}
.top #phases.hide{display:flex!important;visibility:hidden;pointer-events:none}
.top .topright{display:block;min-width:0;width:118px;text-align:right}
body.view-workspace{height:100dvh;overflow:hidden}
body.view-workspace .canvas{height:calc(100dvh - 60px);max-width:none;display:flex;flex-direction:column;overflow:hidden;padding:12px 16px 14px}
body.view-workspace #app{flex:1;min-height:0;overflow:hidden}
body.view-workspace #app>.main{height:100%;min-height:0;align-items:stretch}
body.view-workspace #app>.main>.panel{height:100%;max-height:100%;min-height:0}
body.view-workspace .a-layout>.panel:first-child{display:flex;flex-direction:column;overflow:hidden}
body.view-workspace .a-layout .schedule{flex:1;min-height:0;max-height:none;overflow-y:auto;overflow-x:auto;overscroll-behavior:contain}
body.view-workspace .a-layout .schedule-head{position:sticky;top:0;z-index:2}
body.view-workspace .detail-compact{height:100%;min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
body.view-workspace .meeting-list{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
body.view-workspace .meeting-list .meeting-data{flex:1;min-height:0;max-height:none;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
body.view-workspace .report-workspace{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
body.view-workspace .report-workspace .reportbar{flex:none}
body.view-workspace .report-workspace .report-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;border-radius:12px}
body.view-workspace .report-scroll .lead-wrap{margin:0 auto}
#scheduleTableScroll:focus-visible,#reportContentScroll:focus-visible{outline:3px solid #6bb1d6;outline-offset:-3px}
@media(max-width:1220px){
.top{grid-template-columns:42px minmax(135px,1fr) max-content 180px}
.top .topright{display:none}
.top #phases{width:180px}
}
@media(max-width:970px){
.top{grid-template-columns:minmax(155px,1fr) minmax(0,1fr);grid-template-areas:"brand project" "nav phases";height:auto;min-height:60px;padding:9px 12px;gap:8px 12px}
.top .brand{grid-area:brand}
.top .project-head{grid-area:project}
.top .concept-controls{grid-area:nav;justify-self:start}
.top #phases{grid-area:phases;justify-self:end}
body.view-workspace{height:auto;overflow:auto}
body.view-workspace .canvas{height:auto;display:block;overflow:visible;padding:12px}
body.view-workspace #app{overflow:visible}
body.view-workspace #app>.main{height:auto;align-items:start}
body.view-workspace #app>.main>.panel{height:auto;max-height:none}
body.view-workspace .a-layout>.panel:first-child{max-height:490px}
body.view-workspace .a-layout .schedule{flex:none;max-height:420px;overflow:auto}
body.view-workspace .detail-compact{height:auto;max-height:none;overflow:visible}
body.view-workspace .meeting-list{height:auto;max-height:none}
body.view-workspace .meeting-list .meeting-data{flex:none;max-height:420px;min-height:160px;overflow:auto}
body.view-workspace .report-workspace{height:auto;overflow:visible}
body.view-workspace .report-workspace .report-scroll{flex:none;height:auto;overflow:visible}
}
@media(max-width:620px){
.top{grid-template-columns:1fr;grid-template-areas:"brand" "project" "nav" "phases"}
.top .concept-controls{max-width:100%;overflow-x:auto}
.top #phases{justify-self:start}
}


/* DES-009: same inspector width in Schedule and Meeting Review.
   Override older concept-specific grid rules only at desktop split-pane widths. */
@media(min-width:971px){
  body.view-workspace #app>.main.a-layout,
  body.view-workspace #app>.main.b-layout{
    grid-template-columns:minmax(0,1fr) minmax(365px,39%);
  }
}


/* DES-009: future read-only History / Settings and draft-navigation state study.
 * Primary 3-button nav and inspector width remain those of endorsed DES-006. */
.top .topright{width:118px;position:relative}
.topright .ghost{width:110px}
.overlay-shell{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#182c4073;padding:18px}
.overlay-shell.hide{display:none}
.overlay-card{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 65px #183b5c33;width:min(740px,100%);max-height:min(86dvh,730px);display:flex;flex-direction:column;overflow:hidden}
.overlay-head{padding:16px 19px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex:none}
.overlay-head h2{font-size:18px;margin:0}.overlay-scroll{padding:16px 19px;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.overlay-foot{border-top:1px solid var(--line);padding:11px 19px;display:flex;gap:9px;justify-content:flex-end;flex:none}
.overlay-menu{max-width:440px;place-self:start end;margin:57px 15px 0 0}
.overlay-menu .overlay-scroll{padding:8px}
.overlay-menu button{display:block;width:100%;border:0;border-radius:7px;padding:12px;text-align:left;background:transparent;color:var(--ink)}
.overlay-menu button:hover{background:var(--accentbg)}
.synthetic-data-banner{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:10px 11px;margin-bottom:13px;background:#f6f8fa}
.history-save{border:1px solid var(--line);border-radius:9px;padding:13px;margin:10px 0}
.history-save h3{font-size:13px;margin:0 0 6px}
.history-field{font-size:12px;padding:7px 0;border-top:1px solid #e7edf2;line-height:1.6}
.settings-row{display:flex;gap:20px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.settings-row label{font-size:12px;font-weight:700}
.settings-row select{min-width:215px;height:36px;border:1px solid #d6e2eb;border-radius:7px;padding:7px;font-size:12px}
.settings-cols{display:flex;gap:14px;flex-wrap:wrap;padding:10px 0}
.settings-cols label{font-size:12px;color:var(--ink)}
.history-actions{display:flex;gap:7px;align-items:center}
.history-actions .ghost{font-size:11px}
.overlay-card button:focus-visible{outline:3px solid #5aa9d6;outline-offset:2px}
@media(max-width:760px){.overlay-card{max-height:93dvh}.overlay-menu{margin:90px 10px 0;}.settings-row{display:block}.settings-row select{width:100%;margin-top:8px}}


/* DES-009: authentic existing favicon, release/build provenance and fixed right drawers */
.mark{width:34px;height:34px;border:0;background:transparent;border-radius:6px;overflow:hidden;flex:none}
.app-brand-icon{width:34px;height:34px;display:block;object-fit:contain}
.app-version-label{font-size:10px;color:#527a91;background:#edf5f9;border:1px solid #d6e7f0;border-radius:5px;padding:2px 5px;font-weight:650}
.drawer-host{position:fixed;inset:0;z-index:95;pointer-events:none;visibility:hidden;transition:visibility 0s linear .22s}
.drawer-host.open{pointer-events:auto;visibility:visible;transition:visibility 0s}
.drawer-scrim{position:absolute;inset:0;background:#0c243556;opacity:0;transition:opacity .22s ease}
.drawer-host.open .drawer-scrim{opacity:1}
.drawer-panel{position:absolute;right:0;top:0;bottom:0;max-width:100vw;width:min(570px,100vw);background:var(--paper);border-left:1px solid #cfdae5;box-shadow:-12px 0 45px #132e4826;transform:translateX(103%);transition:transform .23s cubic-bezier(.2,.75,.25,1);display:flex;flex-direction:column;overflow:hidden}
.drawer-host.open .drawer-panel{transform:translateX(0)}
.drawer-contents{display:flex;flex-direction:column;height:100%;min-height:0}
.drawer-head{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line);flex:none}
.drawer-head h2{font-size:19px;margin:0;line-height:1.1;letter-spacing:-.025em}
.drawer-head .ghost{margin-left:auto}
.drawer-subnav{display:flex;gap:6px;padding:12px 18px;background:#f8fafc;border-bottom:1px solid #e3ebf2;flex:none}
.drawer-subnav button{font-size:12px;flex:1;border:1px solid #dbe6ee;background:white;border-radius:7px;padding:9px 11px;color:#496477;font-weight:650}
.drawer-subnav button.active{background:#e4f3fa;color:#14688f;border-color:#a7cbe0}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 24px;overscroll-behavior:contain}
.drawer-bottom{flex:none;border-top:1px solid var(--line);padding:13px 18px;display:flex;gap:9px;justify-content:flex-end;background:white}
.drawer-section{margin-bottom:16px}
.drawer-section h3{margin:0 0 9px;font-size:13px}
.drawer-note{font-size:11px;color:#6b7e90;line-height:1.55;padding:10px 11px;border:1px solid #dce9f1;border-radius:8px;background:#f7fbfd}
.version-panel{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.version-panel .detail-fact{background:#f7f9fb}
.drawer-history-filter{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.drawer-history-filter label{font-size:11px;color:#647b8d;flex:1}
.drawer-history-filter select{display:block;width:100%;height:35px;margin-top:5px;padding:5px 7px;border:1px solid #d7e1e9;border-radius:7px;background:white;font:inherit;font-size:12px}
.history-log-head,.history-log-row{display:grid;grid-template-columns:118px minmax(125px,1fr) minmax(175px,1.25fr);gap:10px;align-items:start}
.history-log-head{padding:9px 10px;background:#f0f4f8;color:#648096;border:1px solid #e2e9ef;border-radius:7px 7px 0 0;font-size:10px;font-weight:750;position:sticky;top:0;z-index:2}
.history-log-row{padding:12px 10px;border-bottom:1px solid #e6edf2;font-size:12px;background:#fff}
.history-log-row[data-save-group="0"]{border-left:3px solid #7aaac7;background:#f8fbfe}.history-log-row[data-save-group="1"]{border-left:3px solid #c2d2dd}.history-log-row:hover{background:#e9f5fb}
.history-log-time{font-size:11px;font-variant-numeric:tabular-nums;color:#49647e}
.history-log-task{font-weight:650;min-width:0;overflow-wrap:anywhere}
.history-log-task .tiny{font-weight:400}
.history-log-action{min-width:0;overflow-wrap:anywhere}
.history-log-action strong{display:block;color:#264960;font-size:12px;margin-bottom:4px}
.history-value{font:11px/1.5 Consolas,monospace;color:#4b6577;border-radius:4px;background:#f1f6f9;padding:4px 6px;display:inline-block;margin:2px 0;max-width:100%;overflow-wrap:anywhere}
.history-log-wrap{border:1px solid #e2e9ef;border-top:0;border-radius:0 0 8px 8px}
.history-save-ref{color:#8397a5;font-size:10px;margin-top:4px}
.drawer-crumb{font-size:11px;color:#657a8c;margin:0 0 11px}
.drawer-info{font-size:11px;color:#50677e;margin-top:8px}
.drawer-settings-link{display:block;width:100%;border:1px solid #dae6ee;background:#fff;border-radius:8px;text-align:left;padding:12px;color:#146b95;font-size:12px;font-weight:700;margin:11px 0}
.drawer-settings-link:hover{background:#eaf6fc}
.drawer-settings-link span{display:block;color:#7a8c9d;font-size:11px;font-weight:400;margin-top:4px}
.drawer-settings-reset{padding:14px;border:1px solid #e3eaf0;background:#fbfcfd;border-radius:8px;margin-top:10px}
@media(max-width:600px){.history-log-head,.history-log-row{grid-template-columns:100px minmax(100px,1fr)}.history-log-head>*:nth-child(3),.history-log-row>*:nth-child(3){grid-column:1/-1}.history-log-head>*:nth-child(3){display:none}.history-log-row{gap:6px}.drawer-panel{width:100vw}}
@media(prefers-reduced-motion:reduce){.drawer-host,.drawer-scrim,.drawer-panel{transition:none}}
</style>
</head>

function utc(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||""))return null;var d=new Date(iso+"T00:00:00Z");return Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==iso?null:d}
function dayIso(d){return d.toISOString().slice(0,10)}
function shiftDate(iso,days){var d=utc(iso);return d?dayIso(new Date(d.getTime()+days*86400000)):iso}
function displayDate(s){var d=utc(s);return d?d.toLocaleDateString("en-US",{month:"short",day:"2-digit",timeZone:"UTC"}):"Unknown"}

function remaining(s){return workdayCount(calendar.asOf,s)}

return '<div class="history-log-row" data-save-group="'+esc(historyFixture.findIndex(function(g){return g.save===row.save})%2)+'" data-history-action="'+esc(c.field)+'" data-save-ref="'+esc(row.save)+'">'+
'<div class="history-log-time">'+esc(formattedTime(row.when))+'<div class="history-save-ref">Ref '+esc(row.save)+'</div></div>'+
'<div class="history-log-task">'+esc(c.wbs)+' · '+esc(c.title)+'<div class="tiny">'+esc(currentGroup)+'</div></div>'+
'<div class="history-log-action"><strong>'+esc(friendlyAction(c.field))+'</strong><span class="history-value">'+esc(c.old)+'</span> → <span class="history-value">'+esc(c.value)+'</span></div></div>'}).join(""):'<div class="zero-match">No matching saved changes in this sample.</div>')+'</div>';
footer='<span class="tiny">Synthetic history · no workbook access</span>';
}else{
body='<div class="drawer-note">This is a UI design simulation. Preferences change this page session only; the current app contract calls for local browser storage. Settings and Change History share this slide-out pane.</div>'+
'<div class="drawer-section"><h3>Display</h3>'+
'<div class="settings-row"><label for="zoneSetting">Display timezone</label><select id="zoneSetting">'+["Asia/Tokyo","UTC","America/Los_Angeles"].map(function(zone){return '<option'+(zone===state.settings.timezone?" selected":"")+'>'+zone+'</option>'}).join("")+'</select></div>'+
'<div class="settings-row"><label for="appearanceSetting">Appearance</label><select id="appearanceSetting">'+["System","Light","Dark"].map(function(mode){return '<option'+(mode===state.settings.appearance?" selected":"")+'>'+mode+'</option>'}).join("")+'</select></div>'+
'<div class="settings-row"><label>Visible columns (illustrative)</label><div class="settings-cols">'+["Owner","Status","Finish"].map(function(name){return '<label><input type="checkbox" data-col="'+name+'"'+(state.settings.columns[name]?" checked":"")+'> '+name+'</label>'}).join("")+'</div></div></div>'+
'<div class="drawer-section"><h3>About this application</h3><div class="version-panel">'+
'<div class="detail-fact"><div class="key">Package version</div><div class="val">v'+esc(appPackageVersion)+'</div></div>'+
'<div class="detail-fact"><div class="key">Approved UI baseline</div><div class="val">'+esc(approvedUiBaseline)+'</div></div></div>'+
'<div class="drawer-info">Package version comes from the repository package.json and is currently a 0.0.0 placeholder, not a separately confirmed public release version. The approved UI baseline is v18. DES-009 is a design mock.</div></div>'+
'<div class="drawer-section"><h3>Preference reset</h3>'+
(state.drawerConfirmReset?'<div class="drawer-settings-reset"><strong>Reset preferences?</strong><p class="note">Restore simulated defaults (Asia/Tokyo, System appearance and default columns). Production must detect the system timezone.</p><button type="button" class="ghost" id="resetCancel">Cancel</button> <button type="button" class="solid" id="resetConfirm">Confirm reset</button></div>':'<button type="button" class="ghost" id="resetSettings">Reset to defaults…</button>')+'</div>'+
'<div class="drawer-note">Example UTC Save timestamp: '+esc(formattedTime("2026-11-06T05:10:00Z"))+' · Planned finish (date-only) remains 2026-11-14.</div>';
footer='<span class="tiny">Local preference illustration · nothing saved</span>';
}
content.innerHTML='<div class="drawer-head"><h2>'+esc(title)+'</h2><button type="button" class="ghost" id="drawerClose" aria-label="Close side pane">Close ×</button></div>'+tabButtons+
'<div class="drawer-body" tabindex="0">'+body+'</div><div class="drawer-bottom">'+footer+'</div>';
function bind(id,fn){var elem=document.getElementById(id);if(elem)elem.addEventListener("click",fn)}
bind("drawerClose",closeDrawer);
function refocus(id){var item=document.getElementById(id);if(item&&typeof item.focus==="function")item.focus()}
if(state.drawerJustOpened){refocus("drawerClose");state.drawerJustOpened=false}
var scrim=document.getElementById("drawerScrim");if(scrim)scrim.onclick=closeDrawer;
document.querySelectorAll("[data-drawer-tab]").forEach(function(el){el.addEventListener("click",function(){
var tab=el.dataset.drawerTab;if(tab==="history"){state.historyTask=null;state.historyField="all"}
state.drawer=tab;state.drawerConfirmReset=false;renderDrawer();
document.querySelectorAll("[data-drawer-tab]").forEach(function(next){if(next.dataset.drawerTab===tab&&typeof next.focus==="function")next.focus()})
})});
var taskFilter=document.getElementById("historyTaskFilter");if(taskFilter)taskFilter.addEventListener("change",function(){state.historyTask=taskFilter.value==="all"?null:taskFilter.value;renderDrawer();refocus("historyTaskFilter")});
var fieldFilter=document.getElementById("historyFieldFilter");if(fieldFilter)fieldFilter.addEventListener("change",function(){state.historyField=fieldFilter.value;renderDrawer();refocus("historyFieldFilter")});
var zone=document.getElementById("zoneSetting");if(zone)zone.addEventListener("change",function(){state.settings.timezone=zone.value;renderDrawer();refocus("zoneSetting")});
var appearance=document.getElementById("appearanceSetting");if(appearance)appearance.addEventListener("change",function(){state.settings.appearance=appearance.value;renderDrawer();refocus("appearanceSetting")});
document.querySelectorAll("[data-col]").forEach(function(el){el.addEventListener("change",function(){state.settings.columns[el.dataset.col]=el.checked})});
bind("resetSettings",function(){state.drawerConfirmReset=true;renderDrawer();refocus("resetCancel")});
bind("resetCancel",function(){state.drawerConfirmReset=false;renderDrawer();refocus("resetSettings")});
bind("resetConfirm",function(){state.settings={timezone:"Asia/Tokyo",appearance:"System",columns:{Owner:true,Status:true,Finish:true}};state.drawerConfirmReset=false;renderDrawer();refocus("resetSettings")});
}
function renderOverlay(){
var el=document.getElementById("overlayShell");if(!el)return;
if(state.overlay!=="dirty"){el.classList.add("hide");el.innerHTML="";return}
el.classList.remove("hide");
el.innerHTML='<section class="overlay-card" role="alertdialog" aria-modal="true" aria-label="Unsaved task draft"><div class="overlay-head"><h2>Unsaved task draft</h2></div><div class="overlay-scroll"><div class="synthetic-data-banner">This task has changes. Choose Save, Discard or Cancel before leaving it. Simulated Save does not write a workbook or append UpdateHistory.</div></div><div class="overlay-foot"><button class="ghost" type="button" id="dirtyCancel">Cancel · keep editing</button><button class="ghost" type="button" id="dirtyDiscard">Discard · continue</button><button class="solid" type="button" id="dirtySave">Simulate Save · continue</button></div></section>';
function bind(id,fn){var e=document.getElementById(id);if(e)e.addEventListener("click",fn)}
bind("dirtyCancel",closeOverlay);
bind("dirtyDiscard",function(){var next=state.pendingNav;state.overlay=null;state.pendingNav=null;state.editing=false;render();if(next)next()});
bind("dirtySave",function(){var next=state.pendingNav;if(demoSave()){state.overlay=null;state.pendingNav=null;renderOverlay();if(next)next();else render()}});
}

function render(){
document.querySelectorAll("[data-view]").forEach(function(el){el.classList.toggle("active",el.dataset.view===state.view)});
document.querySelectorAll("[data-stage]").forEach(function(el){el.classList.toggle("active",el.dataset.stage===state.stage)});
document.getElementById("phases").classList.toggle("hide",state.view!=="a");
if(document.body&&document.body.classList){document.body.classList.toggle("view-workspace",true);document.body.classList.toggle("view-meeting",state.view==="b");document.body.classList.toggle("view-schedule",state.view==="a");document.body.classList.toggle("view-reports",state.view==="l");}
document.getElementById("mainDescription").textContent=state.view==="l"?"Latest Status and proposed weekly Update Report presentation · synthetic data only": "Synthetic meeting: "+displayDate(calendar.asOf)+" · filters use holidays and project blackout calendar";
document.getElementById("app").innerHTML=state.view==="l"?lScreen():state.view==="a"?aScreen():bScreen();
var scheduleScroll=document.getElementById("scheduleTableScroll");if(scheduleScroll){scheduleScroll.scrollTop=state.scheduleScroll;scheduleScroll.addEventListener("scroll",function(){state.scheduleScroll=scheduleScroll.scrollTop});}
var reportScroll=document.getElementById("reportContentScroll");if(reportScroll){reportScroll.scrollTop=state.reportScroll;reportScroll.addEventListener("scroll",function(){state.reportScroll=reportScroll.scrollTop});}
var scroller=document.getElementById("meetingListScroll");if(scroller){scroller.scrollTop=state.listScroll;scroller.addEventListener("scroll",function(){state.listScroll=scroller.scrollTop});if(state.scrollToSelected&&typeof scroller.querySelector==="function"){var chosen=scroller.querySelector(".meeting-item.selected");if(chosen&&typeof chosen.scrollIntoView==="function")chosen.scrollIntoView({block:"nearest"});state.scrollToSelected=false;}}
document.querySelectorAll("[data-task]").forEach(function(el){function action(){var taskId=el.dataset.task;requestNavigation(function(){state.selected=taskId;render()})}el.addEventListener("click",action);el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();action()}})});
document.querySelectorAll("[data-link-task]").forEach(function(el){el.addEventListener("click",function(){var taskId=el.dataset.linkTask;requestNavigation(function(){state.selected=taskId;state.filter="all";state.workstream="all";state.owner="all";state.stage="workstream";state.listScroll=0;state.scrollToSelected=true;render()})})});
document.querySelectorAll("[data-filter]").forEach(function(el){el.addEventListener("click",function(){var filter=el.dataset.filter;requestNavigation(function(){state.filter=filter;state.listScroll=0;ensureSelection();render()})})});
var fw=document.getElementById("filterWorkstream");if(fw)fw.addEventListener("change",function(){var selected=fw.value;var proceeded=requestNavigation(function(){state.workstream=selected;state.listScroll=0;ensureSelection();render()});if(!proceeded)fw.value=state.workstream;});
var fo=document.getElementById("filterOwner");if(fo)fo.addEventListener("change",function(){var selected=fo.value;var proceeded=requestNavigation(function(){state.owner=selected;state.listScroll=0;ensureSelection();render()});if(!proceeded)fo.value=state.owner;});
var md=document.getElementById("meetingDate");if(md)md.addEventListener("change",function(){var selected=md.value;if(!utc(selected)){alert("Choose a valid meeting date.");md.value=calendar.asOf;return}var proceeded=requestNavigation(function(){calendar.asOf=selected;state.listScroll=0;if(!state.periodTouched){state.periodStart=shiftDate(selected,-7);state.periodEnd=selected;state.dirty=true}ensureSelection();render()});if(!proceeded)md.value=calendar.asOf;});
var clear=document.getElementById("clearFilters");if(clear)clear.addEventListener("click",function(){requestNavigation(function(){state.filter="all";state.owner="all";state.workstream="all";state.listScroll=0;ensureSelection();render()})});
var edit=document.getElementById("meetingEdit");if(edit)edit.addEventListener("click",function(){state.editing=true;render()});
var historyButton=document.getElementById("taskHistory");if(historyButton)historyButton.addEventListener("click",function(){openOverlay("history",state.selected)});
var settingsButton=document.getElementById("settingsButton");if(settingsButton)settingsButton.addEventListener("click",function(){requestNavigation(function(){openDrawer("settings")})});
var cancel=document.getElementById("cancelEdit");if(cancel)cancel.addEventListener("click",function(){state.editing=false;render()});
var save=document.getElementById("demoSave");if(save)save.addEventListener("click",demoSave);
document.querySelectorAll("[data-report]").forEach(function(el){el.addEventListener("click",function(){state.reportMode=el.dataset.report;state.reportScroll=0;render()})});
document.querySelectorAll("[data-display]").forEach(function(el){el.addEventListener("click",function(){state.reportDisplay=el.dataset.display;state.reportScroll=0;render()})});
var ps=document.getElementById("periodStart");if(ps)ps.addEventListener("change",function(){state.periodStart=ps.value;state.periodTouched=true;state.dirty=true;render()});
var pe=document.getElementById("periodEnd");if(pe)pe.addEventListener("change",function(){state.periodEnd=pe.value;state.periodTouched=true;state.dirty=true;render()});
var ref=document.getElementById("refreshReport");if(ref)ref.addEventListener("click",function(){if(state.reportMode==="updates"&&(!utc(state.periodStart)||!utc(state.periodEnd)||state.periodStart>state.periodEnd)){alert("Please select a valid reporting period.");return}state.reportSnapshots[state.reportMode]=buildReport(state.reportMode);state.dirty=false;state.reportScroll=0;render()});
var copy=document.getElementById("copyReport");if(copy)copy.addEventListener("click",function(){var snap=state.reportSnapshots[state.reportMode];if(!snap){alert("Generate a report first.");return}if(typeof navigator==="undefined"||!navigator.clipboard||!navigator.clipboard.writeText){alert("Clipboard unavailable here. Copy from plain-text preview manually.");return}navigator.clipboard.writeText(snap.text).then(function(){alert("Copied the exact displayed snapshot text.")},function(){alert("Clipboard copy failed. Use the plain-text preview.")})});
renderDrawer();
renderOverlay();
}
function allowNavigate(){if(state.editing){if(!draftHasChanges()){state.editing=false;return true}alert("This design mock requires Save/Discard/Cancel for edited drafts. Use primary navigation or task selection to try the three-option flow.");return false}return true}
function demoSave(){var t=current();if(!t)return false;var owner=document.getElementById("owner").value.trim(),finish=document.getElementById("finish").value,status=document.getElementById("status").value,pct=Number(document.getElementById("pct").value),update=document.getElementById("updateText").value.trim();
if(!utc(finish)||!Number.isFinite(pct)||pct<0||pct>100){alert("Invalid date/progress in simulated editor.");return false}
t.owner=owner;t.end=finish;t.status=status;t.pct=pct;if(update)state.demoEntries.push({id:t.id,text:"Demo edit · "+update});state.editing=false;if(!filterTasks().some(function(x){return x.id===t.id})){state.filter="all";state.owner="all";state.workstream="all"}render();return true}
document.querySelectorAll("[data-view]").forEach(function(el){el.addEventListener("click",function(){var view=el.dataset.view;requestNavigation(function(){state.view=view;if(state.view==="b"){ensureSelection();state.listScroll=0}render()})})});
document.querySelectorAll("[data-stage]").forEach(function(el){el.addEventListener("click",function(){var stage=el.dataset.stage;requestNavigation(function(){state.stage=stage;render()})})});
if(typeof document.addEventListener==="function"){document.addEventListener("keydown",function(ev){
if(ev.key==="Escape"){if(state.overlay==="dirty"){closeOverlay()}else if(state.drawer){closeDrawer()}return;}
if(ev.key==="Tab"&&state.drawer&&!state.overlay){var panel=document.getElementById("drawerPanel");if(!panel||typeof panel.querySelectorAll!=="function")return;
var items=Array.from(panel.querySelectorAll('button:not([disabled]),select:not([disabled]),input:not([disabled]),[tabindex="0"]')).filter(function(item){return item.offsetParent!==null});
if(!items.length)return;var first=items[0],last=items[items.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}})}
ensureSelection();render();
})();

</script>
</body>
